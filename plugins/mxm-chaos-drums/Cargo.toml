[package]
name = "mxm-chaos-drums"
description = "An original sixteen-cell drum instrument that runs on charge"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
# `vst3` exports the VST3 as well as the CLAP (`nice_export_vst3!`); the bundler makes a `.vst3`
# whenever the library exports one.
nice-plug = { workspace = true, features = ["vst3"] }
mxm-chaos-drums-dsp.workspace = true
# The cells' names, made up from their models' kinds or typed (mxm-kit's `crates/mxm-drum-shell`).
mxm-drum-shell.workspace = true
mxm-params.workspace = true
mxm-part-routing.workspace = true
mxm-preset.workspace = true
mxm-tempo.workspace = true

[dev-dependencies]
# The collection's shared headless checks (`crates/mxm-plugin-test`).
mxm-plugin-test.workspace = true
